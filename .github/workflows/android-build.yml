name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Los secretos se exponen como variables del job: el contexto `secrets` no
    # se puede consultar de forma fiable dentro de un `if` de paso.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # El versionCode sube solo en cada ejecución, así Android siempre ve la
      # nueva compilación como más reciente que la instalada.
      - name: Calcular versión
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Version code: ${{ github.run_number }} / name: 1.${{ github.run_number }}"

      # Si algún día se configuran los secretos, se usa ese keystore privado.
      # Si no existen, se usa el keystore incluido en el repositorio y todo
      # sigue funcionando igual.
      - name: Usar keystore de los secretos (si existe)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TOM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "TOM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "TOM_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "TOM_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build release APK
        env:
          TOM_VERSION_CODE: ${{ steps.version.outputs.code }}
          TOM_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle -p android assembleRelease --stacktrace

      # Comprueba que el APK quedó realmente firmado y deja a la vista la huella
      # del certificado: si dos compilaciones muestran la misma huella, la
      # actualización se instalará sin el error de conflicto de paquete.
      - name: Verificar firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package:|versionCode|versionName" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tom-finance-apk-v1.${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
